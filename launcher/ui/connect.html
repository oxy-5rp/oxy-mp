<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>oxyMP</title>
<style>
  :root {
    --bg: #0a0c10;
    --panel: #12161d;
    --line: #222833;
    --text: #e8ecf2;
    --muted: #79839a;
    --accent: #4cc2ff;
    --danger: #ff6f61;
    --ok: #5ad19a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
    user-select: none;
    overflow: hidden;
  }

  /* Косые полосы на фоне: одна деталь, которая отличает окно от пустого
     прямоугольника, и при этом ничего не весит. */
  body::before {
    content: "";
    position: fixed;
    inset: -40%;
    background: repeating-linear-gradient(
      -45deg, transparent 0 22px, rgba(76,194,255,.028) 22px 44px);
    pointer-events: none;
  }

  .frame {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 34px 34px 26px;
  }

  header { margin-bottom: 28px; }

  .brand {
    font-size: 30px;
    font-weight: 300;
    letter-spacing: .5px;
  }
  .brand b { font-weight: 700; color: var(--accent); }

  .tagline {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12.5px;
  }

  form { display: flex; flex-direction: column; gap: 16px; }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 11px;
    letter-spacing: 1.1px;
    text-transform: uppercase;
    color: var(--muted);
  }

  input {
    width: 100%;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    font-variant-numeric: tabular-nums;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    user-select: text;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(76,194,255,.13);
  }
  input::placeholder { color: #4a5266; }

  .hint { margin-top: 6px; font-size: 11.5px; color: var(--muted); }

  button {
    margin-top: 4px;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #06121a;
    font: 600 14px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .3px;
    cursor: pointer;
    transition: filter .15s, transform .06s;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { background: #263041; color: var(--muted); cursor: default; }

  .status {
    margin-top: 20px;
    min-height: 40px;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-left-width: 3px;
    border-radius: 6px;
    background: var(--panel);
    font-size: 12.5px;
    color: var(--muted);
    white-space: pre-line;
  }
  .status.work { border-left-color: var(--accent); color: var(--text); }
  .status.ok   { border-left-color: var(--ok);     color: var(--text); }
  .status.bad  { border-left-color: var(--danger); color: #ffbdb6; }
  .status.idle { border-left-color: var(--line); }

  footer {
    margin-top: auto;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #545c70;
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <div class="brand">oxy<b>MP</b></div>
    <div class="tagline">мультиплеер поверх одиночной GTA V</div>
  </header>

  <form id="form">
    <div>
      <label for="address">Адрес сервера</label>
      <input id="address" value="127.0.0.1:22005" spellcheck="false" autocomplete="off">
      <div class="hint">Порт можно не писать — тогда возьмётся 22005.</div>
    </div>

    <div>
      <label for="nickname">Имя игрока</label>
      <input id="nickname" value="player" maxlength="24" spellcheck="false" autocomplete="off">
    </div>

    <button id="go" type="submit">Подключиться</button>
  </form>

  <div id="status" class="status idle">Игра ещё не запущена.</div>

  <footer>
    <span>GTA V 1.0.3889.0</span>
    <span id="build">сборка Jul 9 2026</span>
  </footer>
</div>

<script>
  const status = document.getElementById('status');
  const button = document.getElementById('go');
  const address = document.getElementById('address');
  const nickname = document.getElementById('nickname');

  document.getElementById('form').addEventListener('submit', event => {
    event.preventDefault();
    if (button.disabled) return;

    button.disabled = true;
    window.chrome.webview.postMessage({
      action: 'connect',
      address: address.value.trim(),
      nickname: nickname.value.trim() || 'player'
    });
  });

  window.chrome.webview.addEventListener('message', event => {
    const message = event.data;
    if (message.action !== 'status') return;

    status.className = 'status ' + (message.kind || 'idle');
    status.textContent = message.text;

    if (message.kind === 'bad' || message.kind === 'idle') {
      button.disabled = false;
    }
  });

  address.focus();
  address.select();
</script>
</body>
</html>
