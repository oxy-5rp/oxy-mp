# Показательный режим в формате alt:V — обе половины.
#
# По умолчанию выключен. Чтобы посмотреть, впишите его имя в server.cfg:
#
#   resources: altv-demo
#
# Он же и проверка: если на экране игры появилась его страница, значит работают
# разом клиентская машина, раздача файлов, схема http://resource и мостик к
# слою интерфейса.

type = 'js'
main = 'server/index.js'

client-main = 'client/index.js'
client-files = [ 'client/*' ]

deps = []
