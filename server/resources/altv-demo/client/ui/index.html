<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>oxyMP — слой alt:V</title>
<style>
  /* Фон прозрачный: страница ложится в кадр игры, а не заменяет его.
     Непрозрачный закрыл бы собой игру целиком. */
  html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #f2f4f8;
      overflow: hidden;
  }

  .окно {
      position: absolute;
      top: 48px;
      left: 48px;
      width: 560px;
      padding: 22px 26px;
      border-radius: 14px;
      background: rgba(14, 17, 24, 0.86);
      border: 1px solid rgba(120, 200, 255, 0.35);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
  }

  h1 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: 0.2px;
  }

  .подпись {
      margin: 0 0 16px;
      font-size: 13px;
      color: #8fa3bd;
  }

  ul {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
      line-height: 1.75;
      font-variant-numeric: tabular-nums;
  }

  li {
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 2px 0;
  }

  li:last-child { border-bottom: none; }

  button {
      margin-top: 18px;
      padding: 9px 18px;
      font: inherit;
      font-size: 13px;
      color: #06121f;
      background: #7cc6ff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
  }

  button:hover { background: #9ad4ff; }

  .метка {
      display: inline-block;
      margin-bottom: 12px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      background: rgba(124, 198, 255, 0.16);
      color: #7cc6ff;
  }
</style>
</head>
<body>
  <div class="окно">
    <span class="метка">alt:V на oxyMP</span>
    <h1>Страница игрового режима</h1>
    <p class="подпись" id="кто">ждём сервер…</p>
    <ul id="строки"><li>клиентская половина ещё не отчиталась</li></ul>
    <button id="кнопка">Сказать серверу</button>
  </div>

<script>
// `alt` внутри страницы даёт клиент — тот же объект, что и у alt:V: alt.on для
// событий от ресурса, alt.emit — обратно ему.
const строки = document.getElementById('строки');
const кто = document.getElementById('кто');

alt.on('состояние', (данные) => {
    кто.textContent = данные.имя ? `игрок: ${данные.имя}` : 'игрок неизвестен';

    строки.innerHTML = '';

    for (const строка of данные.строки ?? []) {
        const пункт = document.createElement('li');
        пункт.textContent = строка;
        строки.appendChild(пункт);
    }
});

document.getElementById('кнопка').addEventListener('click', () => {
    alt.emit('нажали', 'кнопку на странице');
});
</script>
</body>
</html>
