# Ресурс в формате alt:V: описание называется resource.toml, а не resource.cfg.
#
# Лежит здесь затем, чтобы совместимость с alt:V проверялась не рассуждением, а
# запуском. По умолчанию выключен — впишите его имя в server.cfg:
#
#   resources: altv-sample

type = 'js'
main = 'server/index.js'

# Списком и в апострофах — как это пишет alt:V. Пусто, потому что клиентской
# части alt:V у oxyMP ещё нет (см. docs/scripting.md).
deps = []

# Настройка alt:V, которую мы пока не исполняем: сервер скажет о ней спокойной
# строкой в журнале, а не жалобой на опечатку. Она здесь нарочно — так видно,
# что чужое описание проходит целиком.
required-permissions = [ 'Screen Capture' ]

[inspector]
host = '127.0.0.1'
port = 9229
