# Настройки сервера oxyMP.
#
# Строка на настройку: «ключ: значение». Решётка начинает примечание. Регистр
# имени ключа значения не имеет — maxplayers и MaxPlayers это одно и то же.
#
# Файл необязателен: без него сервер работает на значениях по умолчанию, и они
# те же, что записаны здесь. Ключи командной строки перекрывают этот файл.

# Как сервер называется. Видно игрокам.
name: oxyMP

# Какой порт слушать. Тот же номер служит и раздаче файлов: игра общается по
# UDP, раздача по TCP, и это разные пространства номеров.
port: 22005

maxplayers: 32

# Где игрок появляется в мире: три числа через запятую и направление взгляда.
# Здесь — у терминала международного аэропорта Лос-Сантоса.
spawn: -1037.7, -2738.0, 20.2
spawnheading: 328.0

# На каком расстоянии игрок узнаёт о происходящем, в метрах.
#
# Дальше этой границы сервер не рассказывает ему ни о машинах, ни о людях: он
# их всё равно не увидит, а снимки о них — половина всего, что ходит по сети.
# Так же устроено в RAGE MP, и число то же самое.
streamdistance: 500.0

# Сколько машин и предметов разрешено в сессии одновременно.
#
# Предел не от жадности: игра держит на свете ограниченное их число и при
# переполнении начинает молча убирать чужие — в том числе те, в которых едут.
maxvehicles: 512
maxobjects: 1024

# С чего начинается погода и время суток.
#
# Названия погоды — те же, что у игры: EXTRASUNNY, CLEAR, CLOUDS, RAIN, THUNDER,
# FOGGY, SNOW и прочие. Часы идут на сервере и рассылаются всем: предоставленные
# себе, они разошлись бы у каждого по-своему.
weather: EXTRASUNNY
time: 12:00

# Кому позволено распоряжаться: номера мест через запятую.
#
# Ноль — тот, кто вошёл первым. Обычно это хозяин сервера, который его и
# запустил.
#
# Сам сервер этим правом не пользуется: распоряжаться в голом сервере нечем.
# Оно нужно ресурсам — скрипт видит признак у игрока и решает, слушать ли его.
# Право остаётся у сервера намеренно: раздавай его скрипт, и первая же ошибка в
# режиме открыла бы сессию всем.
admins: 0

# Откуда брать игровые файлы, которые сервер раздаёт клиентам.
#
# Это готовые .rpf — машина, одежда, карта, — а не скрипты. Путь относительный:
# сервер запускают из его каталога, и требовать полный путь незачем.
gamefiles: resources/dlcpacks

# Где лежат скриптовые ресурсы: каталог на ресурс.
resourcedirectory: resources

# Какие из них поднимать: имена каталогов через запятую.
#
# Перечнем, а не «всё, что лежит рядом», как и у alt:V. Выключенный ресурс,
# лежащий тут же, — обычное дело, и уносить его для этого куда-то не нужно.
# Порядок значим: подписавшийся первым первым и получит возможность отменить
# реплику в чате.
#
# Пусто, и это значение по умолчанию. Голый сервер не умеет ничего, кроме чата и
# появления игрока в мире: ни команд, ни машин, ни распоряжений сессией. Так же
# устроен голый сервер RAGE MP, и причина не в подражании — правила игры
# принадлежат тому, кто пишет режим, а не сборке сервера. Всё, что сервер умеет
# сверх этого, приходит ресурсами отсюда.
resources:
